<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Analyst AI</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #0d1117; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #656d76; }

      /* Make Ant Design Tabs fill available height */
      .ant-tabs { height: 100%; display: flex; flex-direction: column; }
      .ant-tabs-nav { flex-shrink: 0; }
      .ant-tabs-content-holder { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
      .ant-tabs-content { height: 100%; }
      .ant-tabs-tabpane { height: 100%; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
      .ant-tabs-tabpane-hidden { display: none !important; }

      /* Ant Design Sider scrollbar */
      .ant-layout-sider-children { overflow-y: auto; }

      /* Collapse panel body scrollable */
      .ant-collapse-content-box { overflow-y: auto; max-height: 2000px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
