# Agent definitions for the Financial Analyst pipeline.
#
# To add a new agent:
#   1. Add a block here following the schema below.
#   2. Create prompts/<name>.md with the system prompt.
#   3. Create agents/<name>.py inheriting BaseAgent.
#   4. Register the agent in agents/orchestrator.py.
#
# Field reference:
#   model_env_var  — name of the env var (from .env) that holds the model ID
#   tools_allowed  — tool names the agent may call (subset of tools/ functions)

agents:
  orchestrator:
    name: orchestrator
    role: "Coordinates all agents, manages context flow, assembles final report"
    model_env_var: MODEL_ORCHESTRATOR
    max_tokens: 4096
    temperature: 0.2
    tools_allowed: []
    prompt_file: prompts/orchestrator.md

  data_collector:
    name: data_collector
    role: "Fetches stock prices, financial statements, SEC filings, and macro data"
    model_env_var: MODEL_ANALYST
    max_tokens: 4096
    temperature: 0.0
    tools_allowed:
      - fetch_price_data
      - fetch_financials
      - fetch_sec_filing
      - fetch_macro_data
    prompt_file: prompts/data_collector.md

  fundamental_analyst:
    name: fundamental_analyst
    role: "Runs valuation models (P/E, DCF, EV/EBITDA) and computes financial ratios"
    model_env_var: MODEL_ANALYST
    max_tokens: 8192
    temperature: 0.1
    tools_allowed:
      - calculate_pe_ratio
      - calculate_dcf
      - calculate_ev_ebitda
      - calculate_ratios
    prompt_file: prompts/fundamental_analyst.md

  growth_analyst:
    name: growth_analyst
    role: "Computes 3-year revenue/EPS/FCF CAGRs, PEG ratio, and classifies growth quality"
    model_env_var: MODEL_ANALYST
    max_tokens: 4096
    temperature: 0.1
    tools_allowed:
      - calculate_peg_ratio
    prompt_file: prompts/growth_analyst.md

  peer_comparison:
    name: peer_comparison
    role: "Compares valuation multiples to sector peers; computes peer discount/premium"
    model_env_var: MODEL_ANALYST
    max_tokens: 4096
    temperature: 0.1
    tools_allowed:
      - fetch_price_data
    prompt_file: prompts/peer_comparison.md

  technical_analyst:
    name: technical_analyst
    role: "Computes RSI, moving averages, 52-week position, and volume trend; classifies entry signal"
    model_env_var: MODEL_ANALYST
    max_tokens: 2048
    temperature: 0.1
    tools_allowed: []
    prompt_file: prompts/technical_analyst.md

  sentiment_analyst:
    name: sentiment_analyst
    role: "Analyzes news sentiment, earnings call tone, analyst ratings, and insider activity"
    model_env_var: MODEL_ANALYST
    max_tokens: 8192
    temperature: 0.1
    tools_allowed:
      - web_search
      - fetch_analyst_ratings
    prompt_file: prompts/sentiment_analyst.md

  # ── AI Value Chain agents ──────────────────────────────────────────────
  # These 5 agents add the AI value chain lens on top of the classic fundamentals
  # to surface structural pricing gaps / market mistakes about the future of AI.
  # The layer_classifier runs first and gates whether the 4 downstream agents run
  # (it short-circuits for NEUTRAL / MINIMAL AI exposure to save API cost).

  layer_classifier:
    name: layer_classifier
    role: "Classifies the company into one of 7 AI value chain layers (or NEUTRAL) and sets the analytical lens for the downstream AI agents"
    model_env_var: MODEL_ANALYST
    max_tokens: 2048
    temperature: 0.1
    tools_allowed: []
    prompt_file: prompts/layer_classifier.md

  value_creation_analyst:
    name: value_creation_analyst
    role: "Scores current and future (AI-scenario) economic value creation; classifies the company's AI role"
    model_env_var: MODEL_ANALYST
    max_tokens: 3072
    temperature: 0.15
    tools_allowed: []
    prompt_file: prompts/value_creation_analyst.md

  value_capture_analyst:
    name: value_capture_analyst
    role: "Measures how much of the created value flows to the company's P&L today and in 3-5y (pricing power, leakage, commoditization)"
    model_env_var: MODEL_ANALYST
    max_tokens: 3072
    temperature: 0.15
    tools_allowed: []
    prompt_file: prompts/value_capture_analyst.md

  pricing_gap_analyst:
    name: pricing_gap_analyst
    role: "Core market-mistake detector: compares market-implied scenario vs AI-scenario implied by the value chain framework"
    model_env_var: MODEL_ANALYST
    max_tokens: 3072
    temperature: 0.2
    tools_allowed: []
    prompt_file: prompts/pricing_gap_analyst.md

  ai_risk_analyst:
    name: ai_risk_analyst
    role: "Identifies AI-specific structural risks (commoditization, displacement, capex trap, geopolitical, moat erosion) not covered by the base risk agents"
    model_env_var: MODEL_ANALYST
    max_tokens: 3072
    temperature: 0.15
    tools_allowed: []
    prompt_file: prompts/ai_risk_analyst.md

  report_writer:
    name: report_writer
    role: "Generates a formatted daily analyst report in markdown from all agent outputs"
    model_env_var: MODEL_WRITER
    max_tokens: 16384
    temperature: 0.3
    tools_allowed: []
    prompt_file: prompts/report_writer.md
